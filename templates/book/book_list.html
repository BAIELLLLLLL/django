<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список книг</title>
</head>
<body>

    <h1>Список книг</h1>

    {% for book in books %}
        <div>
            <h2>{{ book.title }}</h2>

            <p>Автор: {{ book.author }}</p>
            <p>Жанр: {{ book.genre }}</p>
            <p>Год издания: {{ book.publication_year }}</p>

            <a href="{% url 'book_detail' book.id %}">
                Подробнее о книге
            </a>
        </div>

        <hr>

    {% empty %}
        <p>Книг пока нет.</p>
    {% endfor %}

</body>
</html>
